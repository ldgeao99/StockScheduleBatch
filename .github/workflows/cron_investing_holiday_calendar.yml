name: crawl_investing_holiday_calendar (Monthly)

on:
  schedule:
    # 한국 시간(KST) 매월 1일 오전 09시 실행. UTC 1일 00:00 = KST 1일 09:00 이라
    # UTC·KST 모두 날짜가 1일이 되어 날짜 어긋남 없이 매월 1일에 실행됨.
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-holiday-calendar
  cancel-in-progress: false

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 google-cloud-firestore urllib3

    # 🔑 파이어베이스 서비스 계정 보안 키 디코딩 주입
    - name: Decode Firebase Key
      run: |
        echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" | base64 --decode > stockcalender-13042-firebase-adminsdk-fbsvc-18b1748d9a.json

    - name: Run Global Holiday Crawler
      run: |
        # 기존에 등록된 파일명인 crawl_investing_holiday_calendar.py를 호출합니다.
        python crawl_investing_holiday_calendar.py
    - name: Preserve holiday calendar files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: market-holidays-${{ github.run_id }}-${{ github.run_attempt }}
        path: data/market_holidays/
        if-no-files-found: ignore
        retention-days: 90
    - name: Commit holiday calendar updates
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/market_holidays/
        if git diff --cached --quiet; then
          echo "No holiday calendar changes"
          exit 0
        fi
        git commit -m "Update yearly KR and US market holiday calendars"
        git pull --rebase origin "${{ github.event.repository.default_branch }}"
        git push origin "HEAD:${{ github.event.repository.default_branch }}"
