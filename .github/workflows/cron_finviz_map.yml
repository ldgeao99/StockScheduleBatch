name: finviz_map_telegram (Daily)

on:
  schedule:
    # 한국 시간(KST) 매일 오전 07시 1회 실행 목표.
    # GitHub Actions cron 은 UTC 기준이므로 22:00 UTC = 익일 07:00 KST 에 해당함.
    # (KST는 서머타임이 없어 항상 고정)
    - cron: '0 22 * * *'
  workflow_dispatch: # 필요 시 깃허브 액션 웹에서 수동 실행 가능 버튼 활성화

jobs:
  send-finviz-map:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies (Playwright + Chromium)
      run: |
        python -m pip install --upgrade pip
        pip install playwright requests
        python -m playwright install --with-deps chromium

    - name: Capture finviz maps and send to Telegram
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python finviz_map_telegram.py
